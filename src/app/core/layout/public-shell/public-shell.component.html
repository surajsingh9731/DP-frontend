<a class="skip-link" href="#main-content">{{ copy().skip }}</a>

<!-- Purely decorative — see _buttons.scss provenance note; carries no text/icon meaning. -->
<span class="tricolor-strip" aria-hidden="true"></span>

<div class="public-shell">
  <header class="public-shell__bar">
    <div class="public-shell__bar-inner">
      <div class="public-shell__bar-start">
        <a class="public-shell__brand" routerLink="/" aria-label="Sahmati — home">
          <img src="brand/logo.svg" alt="" width="132" height="33" />
        </a>
        @if (!isHome()) {
          <a class="public-shell__back" routerLink="/">
            <span aria-hidden="true">←</span>
            {{ copy().backToHome }}
          </a>
        }
      </div>

      <div class="public-shell__bar-end">
        <button
          type="button"
          class="public-shell__text-size"
          [attr.aria-pressed]="textSize() === 'large'"
          [attr.aria-label]="textSize() === 'large' ? copy().normalText : copy().largerText"
          (click)="toggleTextSize()"
        >
          <span aria-hidden="true">A+</span>
        </button>
        <app-language-toggle />
      </div>
    </div>
  </header>

  <main id="main-content" class="public-shell__main" tabindex="-1">
    <router-outlet />
  </main>

  <footer class="public-shell__footer">
    <div class="public-shell__footer-inner">
      <div class="public-shell__footer-brand">
        <img src="brand/logo.svg" alt="" width="110" height="27" />
        <p>{{ footerTagline() }}</p>
      </div>
      <p class="public-shell__footer-copyright">{{ footerCopyright() }}</p>
    </div>
  </footer>
</div>
