<div class="language-toggle" role="group" aria-label="Choose language · भाषा चुनें">
  <button
    type="button"
    class="language-toggle__option"
    lang="en"
    [class.language-toggle__option--active]="language() === 'en'"
    [attr.aria-pressed]="language() === 'en'"
    (click)="select('en')"
  >
    English
  </button>
  <button
    type="button"
    class="language-toggle__option"
    lang="hi"
    [class.language-toggle__option--active]="language() === 'hi'"
    [attr.aria-pressed]="language() === 'hi'"
    (click)="select('hi')"
  >
    हिन्दी
  </button>
</div>
